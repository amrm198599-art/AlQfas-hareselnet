name: Android Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Unzip project
        run: |
          mkdir -p project
          for z in *.zip; do unzip -o "$z" -d project; done
          find project -maxdepth 3 | head -60
      - name: Build APK and AAB
        run: |
          S=$(find project -name 'settings.gradle*' -not -path '*/node_modules/*' | head -n1)
          if [ -z "$S" ]; then echo "No settings.gradle found, not an Android Gradle project"; exit 1; fi
          cd "$(dirname "$S")"
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug bundleRelease; else gradle assembleDebug bundleRelease; fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            project/**/build/outputs/apk/debug/*.apk
            project/**/build/outputs/bundle/release/*.aab
